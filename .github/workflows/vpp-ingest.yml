name: VPP Monitor - Ingesta diaria

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Días hacia atrás (usar 400 en el PRIMER run)"
        required: false
        default: "35"
      fuentes:
        description: "Fuentes a ejecutar (all / placsp / boe)"
        required: false
        default: "all"

jobs:
  placsp:
    if: ${{ github.event.inputs.fuentes != 'boe' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        working-directory: ingest
        run: pip install -r requirements.txt
      - name: Ingesta PLACSP + Agregadas
        working-directory: ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '35' }}
        run: python ingest.py

  boe:
    if: ${{ github.event.inputs.fuentes != 'placsp' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        working-directory: ingest
        run: pip install -r requirements.txt
      - name: Ingesta BOE
        working-directory: ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BOE_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '35' }}
        run: python boe_ingest.py

  notify:
    needs: [placsp, boe]
    if: always() && github.event.schedule == '30 6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install requests
      - name: Enviar resumen email
        working-directory: ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          NOTIFY_EMAIL: bsantacreu@sficonsulting.es
          NOTIFY_FROM: bsantacreu@sficonsulting.es
        run: python notify.py
