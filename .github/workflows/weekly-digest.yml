name: Weekly Digest (Lunes 08:00 Madrid)

on:
  schedule:
    - cron: '0 6 * * 1'   # 06:00 UTC = 08:00 Madrid en VERANO (CEST)
    - cron: '0 7 * * 1'   # 07:00 UTC = 08:00 Madrid en INVIERNO (CET)
  workflow_dispatch:

jobs:
  fire-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check Madrid hour
        id: tz
        run: |
          MADRID_HOUR=$(TZ=Europe/Madrid date +%H)
          MADRID_DOW=$(TZ=Europe/Madrid date +%u)
          echo "Madrid time: $(TZ=Europe/Madrid date)"
          if [ "$MADRID_HOUR" = "08" ] && [ "$MADRID_DOW" = "1" ]; then
            echo "go=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> $GITHUB_OUTPUT
          else
            echo "go=false" >> $GITHUB_OUTPUT
            echo "Skip: hora=$MADRID_HOUR dow=$MADRID_DOW"
          fi

      - name: Fetch digest content (HTML + recipients) from Azure Function
        if: steps.tz.outputs.go == 'true'
        id: digest
        env:
          DIGEST_KEY: ${{ secrets.DIGEST_KEY }}
        run: |
          echo "Llamando a /api/weekly-digest?fmt=full"
          if [ -z "$DIGEST_KEY" ]; then
            echo "::warning::Falta el secreto DIGEST_KEY del repositorio; la función lo rechazará en cuanto se active en Azure"
          fi
          RESP=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -H "x-digest-key: $DIGEST_KEY" \
            "https://expansion.sficonsulting.es/api/weekly-digest?fmt=full")
          BODY=$(echo "$RESP" | sed -e 's/HTTP_STATUS:.*//')
          STATUS=$(echo "$RESP" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')
          echo "HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Function devolvió HTTP $STATUS"
            echo "$BODY" | head -c 500
            exit 1
          fi
          # Guardar JSON en el workspace para los siguientes steps
          echo "$BODY" > digest.json
          COUNTS=$(python3 -c "import json; d = json.load(open('digest.json')); print(d['counts'])")
          EMAILS_COUNT=$(python3 -c "import json; d = json.load(open('digest.json')); print(len(d['emails']))")
          echo "Counts: $COUNTS"
          echo "Destinatarios: $EMAILS_COUNT"
          echo "emails_count=$EMAILS_COUNT" >> $GITHUB_OUTPUT
          if [ "$EMAILS_COUNT" = "0" ]; then
            echo "::warning::Grupo 5 sin emails configurados — no se envía nada. Añádelos en la UI."
          fi

      - name: Obtener token Microsoft Graph
        if: steps.tz.outputs.go == 'true' && steps.digest.outputs.emails_count != '0' && steps.digest.outputs.emails_count != ''
        id: token
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
        run: |
          if [ -z "$MS_CLIENT_SECRET" ]; then
            echo "::error::Falta el secret MS_CLIENT_SECRET en GitHub Secrets del repo"
            exit 1
          fi
          if [ -z "$MS_TENANT_ID" ] || [ -z "$MS_CLIENT_ID" ]; then
            echo "::error::Faltan MS_TENANT_ID o MS_CLIENT_ID en GitHub Secrets"
            exit 1
          fi
          RESP=$(curl -sS -X POST \
            "https://login.microsoftonline.com/$MS_TENANT_ID/oauth2/v2.0/token" \
            -d "client_id=$MS_CLIENT_ID&client_secret=$MS_CLIENT_SECRET&scope=https%3A%2F%2Fgraph.microsoft.com%2F.default&grant_type=client_credentials")
          TOKEN=$(echo "$RESP" | python3 -c "import sys, json; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$TOKEN" ]; then
            echo "::error::No se pudo obtener token Graph"
            echo "$RESP" | head -c 500
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "Token obtenido OK"

      - name: Enviar email via Microsoft Graph
        if: steps.tz.outputs.go == 'true' && steps.token.outputs.token != ''
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          NOTIFY_FROM: bsantacreu@sficonsulting.es
        run: |
          python3 << 'PYEOF'
          import json, os, sys, urllib.request, urllib.error
          with open('digest.json') as f:
              digest = json.load(f)
          emails = digest.get('emails', [])
          if not emails:
              print('Sin destinatarios, salto')
              sys.exit(0)
          payload = {
              "message": {
                  "subject": digest['subject'],
                  "body": {"contentType": "HTML", "content": digest['html']},
                  "toRecipients": [{"emailAddress": {"address": e}} for e in emails]
              },
              "saveToSentItems": True
          }
          token = os.environ['TOKEN']
          sender = os.environ['NOTIFY_FROM']
          url = f"https://graph.microsoft.com/v1.0/users/{sender}/sendMail"
          req = urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'),
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(f"Graph sendMail OK: HTTP {r.status} — enviado a {len(emails)} destinatarios: {emails}")
          except urllib.error.HTTPError as e:
              print(f"::error::Graph sendMail HTTP {e.code}: {e.read().decode('utf-8')[:1000]}")
              sys.exit(1)
          PYEOF
